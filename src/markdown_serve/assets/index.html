<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__ — markdown-serve</title>
  <script src="/__assets/theme-boot.js"></script>
  <link rel="stylesheet" href="/__assets/app.css">
  <link rel="stylesheet" href="/__assets/pygments.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;560&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout">
    <aside>
      <div class="brand-row">
        <div class="brand"><strong>markdown</strong>-serve</div>
        <button type="button" id="theme-toggle" aria-label="Toggle light and dark theme" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"></path>
          </svg>
        </button>
      </div>
      <div class="finder-wrap">
        <input id="finder" type="search" placeholder="Search files…" autocomplete="off" spellcheck="false">
        <div class="finder-hint"><span>fuzzy · <kbd>'</kbd> exact</span><span><kbd>/</kbd> focus</span></div>
      </div>
      <nav id="nav"></nav>
    </aside>
    <main>
      <div id="status">connecting…</div>
      <article id="content"><p class="empty">Select a file.</p></article>
    </main>
  </div>
  <script type="application/json" id="markdown-serve-boot">__BOOT_JSON__</script>
  <script type="module" src="/__assets/app.js"></script>
</body>
</html>
