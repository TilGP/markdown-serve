[project]
name = "markdown-serve"
version = "0.1.0"
description = "Local live Markdown viewer with file tree, hot reload, and offline Mermaid/PlantUML"
readme = "README.md"
authors = [
    { name = "Til Georg Pockrandt", email = "til.pockrandt@check24.de" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "markdown>=3.10.3",
    "mdx-truly-sane-lists>=1.3",
    "pygments>=2.20.0",
    "uvicorn>=0.52.1",
    "watchdog>=6.0.0",
    "websockets>=17.0.1",
]

[project.scripts]
markdown-serve = "markdown_serve:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "screenshot: write readme_files/combined.png from Playwright captures",
]
