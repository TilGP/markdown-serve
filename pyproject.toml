[project]
name = "markdown-serve"
version = "0.1.0"
description = "Live-preview markdown files in the current directory"
readme = "README.md"
authors = [
    { name = "Til Georg Pockrandt", email = "til.pockrandt@check24.de" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "markdown>=3.10.3",
    "pygments>=2.20.0",
    "uvicorn>=0.52.1",
    "watchdog>=6.0.0",
    "websockets>=17.0.1",
]

[project.scripts]
markdown-serve = "markdown_serve:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
